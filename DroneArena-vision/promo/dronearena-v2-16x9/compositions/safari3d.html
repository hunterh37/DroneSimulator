<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #safari3d-root { position: absolute; inset: 0; overflow: hidden; background: #ece8df; container-type: size; }
        #safari3d-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
        #safari3d-copy { z-index: 2; position: absolute; left: 5cqw; top: 8cqh; display: flex; flex-direction: column; gap: 1.2cqmin; }
        .sa-num { font-family: "Space Mono", monospace; font-weight: 700; font-size: calc(0.8cqw + 0.8cqh);
          letter-spacing: 0.18em; color: #0c0c0e; text-transform: uppercase; }
        .sa-num b { background: #0c0c0e; color: #d4ff3a; padding: 0.25em 0.55em; margin-right: 0.8em; }
        .sa-line { display: block; overflow: hidden; }
        .sa-line > span { display: inline-block; font-family: "League Gothic", sans-serif; font-size: calc(7cqw + 4cqh);
          line-height: 0.92; color: #0c0c0e; text-transform: uppercase; letter-spacing: 0.005em; }
        .sa-hl { display: inline-block; line-height: 0.92; background: #d4ff3a; padding: 0.04em 0.12em 0; }
        @container (aspect-ratio < 1) {
          #safari3d-copy { left: 6cqw; right: 6cqw; top: 6cqh; }
          .sa-line > span { font-size: calc(11cqw + 2cqh); }
        }
      </style>
      <div id="safari3d-root" data-composition-id="safari3d" data-width="1920" data-height="1080">
        <canvas id="safari3d-canvas" data-ee-canvas="safari3d" data-layout-bleed></canvas>
        <div id="safari3d-copy" data-layout-allow-occlusion>
          <div class="sa-num" id="sa-num"><b>02</b>Mode / Safari</div>
          <span class="sa-line" data-layout-allow-overflow><span>A forest</span></span>
          <span class="sa-line" data-layout-allow-overflow><span>grows <span class="sa-hl">inside</span></span></span>
        </div>
      </div>
      <script>
        (function () {
          const ID = "safari3d";
          const DUR = 2.927;
          window.__eeTime = window.__eeTime || {};
          window.__eeResolve = window.__eeResolve || {};
          window.__hf = window.__hf || {};
          window.__hf.buildReady = window.__hf.buildReady || {};
          window.__hf.buildReady[ID] = new Promise((r) => (window.__eeResolve[ID] = r));
          const st = { t: 0 };
          const tl = gsap.timeline({ paused: true });
          tl.to(st, { t: DUR, duration: DUR, ease: "none", onUpdate() {
            window.__eeTime[ID] = st.t;
            const f = window.__eeScenes && window.__eeScenes[ID];
            if (f) f(st.t);
          } }, 0);
          tl.fromTo("#sa-num", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, 0.3);
          tl.fromTo("#safari3d-copy .sa-line > span", { yPercent: 105 }, { yPercent: 0, duration: 0.45, ease: "expo.out", stagger: 0.08 }, 0.35);
          tl.to("#safari3d-copy .sa-line > span", { yPercent: -105, duration: 0.28, ease: "power3.in", stagger: 0.05 }, 2.1);
          tl.to("#sa-num", { opacity: 0, duration: 0.2 }, 2.1);
          window.__timelines[ID] = tl;
        })();
      </script>
      <script type="module">
        import * as E from "./assets/scene3d.js";
        import * as R from "./assets/room.js";
        import * as P from "./assets/props.js";
        import * as K from "./assets/modekit.js";
        const { THREE } = E;
        const { renderer, scene, camera, room, drone } = await K.setup("safari3d");
        const rand = E.rng(21);
        const grass = new THREE.Color("#8FD86A"), wood = room.mat.floor.color.clone();
        // Forest: seeded trees that keep a clear lane down the middle of the view.
        const trees = [];
        for (let i = 0; i < 26; i++) {
          let x = -1.9 + rand() * 3.8;
          const z = -5.3 + rand() * 3.4;
          if (Math.abs(x) < 0.45) x += Math.sign(x || 1) * 0.5;
          const tr = P.makeTree(rand);
          tr.position.set(x, 0, z);
          tr.rotation.y = rand() * 6.28;
          const s = 0.8 + rand() * 0.7;
          scene.add(tr);
          trees.push({ tr, s, at: 0.4 + rand() * 0.9 });
        }
        const flowers = [];
        const fcols = ["#FF6FB5", "#B44CFF", "#FFFFFF", "#FF5A36", "#FFC928"];
        for (let i = 0; i < 60; i++) {
          const f = new THREE.Mesh(new THREE.IcosahedronGeometry(0.04, 0), R.clay(fcols[i % 5], { flatShading: true }));
          f.position.set(-1.9 + rand() * 3.8, 0.05, -5.4 + rand() * 4.6);
          scene.add(f);
          flowers.push({ f, at: 0.5 + rand() * 0.9 });
        }
        const bees = [0, 1, 2, 3].map((i) => {
          const b = P.makeBee();
          scene.add(b);
          return { b, ph: i * 1.7, r: 0.5 + i * 0.25, cx: [-0.9, 0.8, 0.2, -0.4][i], cz: [-3.4, -3.9, -4.6, -2.6][i] };
        });
        const HAND = R.px(960, 1030, 1.6);
        const path = new THREE.CatmullRomCurve3([
          new THREE.Vector3(-1.2, 1.6, -4.8), new THREE.Vector3(0.6, 1.1, -4.2), new THREE.Vector3(0.9, 0.9, -3.0),
          new THREE.Vector3(-0.5, 0.9, -2.6), new THREE.Vector3(0, 0.8, -2.0), HAND,
        ]);
        const trail = P.makeTrail(path, 0.012);
        scene.add(trail.mesh);
        const OFF = new THREE.Vector3(-1.2, 1.2, 0.8), FOCUS = new THREE.Vector3(0, 0.5, -3.6);
        const MATCH = 2.439;
        function draw(t) {
          const conv = E.easeInOut(E.seg(t, 0.25, 0.9));
          K.sinkProps(room, conv);
          room.mat.floor.color.copy(wood).lerp(grass, conv);
          for (const { tr, s, at } of trees) {
            const k = E.backOut(E.seg(t, at, at + 0.45));
            tr.scale.setScalar(Math.max(0.0001, s * k));
            tr.visible = k > 0;
          }
          for (const { f, at } of flowers) f.scale.setScalar(Math.max(0.0001, E.backOut(E.seg(t, at, at + 0.3))));
          for (const { b, ph, r, cx, cz } of bees) {
            const a = t * 2.2 + ph, k = E.backOut(E.seg(t, 0.9 + ph * 0.1, 1.3 + ph * 0.1));
            b.position.set(cx + Math.cos(a) * r * 0.5, 1.0 + Math.sin(a * 2) * 0.15, cz + Math.sin(a) * r * 0.4);
            b.rotation.y = -a;
            b.scale.setScalar(Math.max(0.0001, k));
          }
          K.cameraArc(camera, t, 0.3, MATCH - 0.1, OFF, FOCUS);
          const k = E.easeInOut(E.seg(t, 0.1, MATCH));
          K.flyDrone(drone, path, k, t, 0.9);
          if (t > MATCH - 0.15) drone.root.rotation.set(0.15, 0, 0);
          trail.reveal(Math.min(1, k + 0.001), Math.max(0, k - 0.35));
          renderer.render(scene, camera);
        }
        E.registerScene("safari3d", draw);
      </script>
    </template>
  </body>
</html>
