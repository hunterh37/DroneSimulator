<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Drone Arena promo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0d0820;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0d0820;
      }
      .scene,
      .shot,
      .inner {
        position: absolute;
        inset: 0;
      }
      .shot {
        overflow: hidden;
      }
      .shot video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 50%;
      }
      #shot-ff video,
      #shot-m3 video {
        object-position: 62% 50%;
      }
      .flash {
        position: absolute;
        inset: 0;
        opacity: 0;
        background: radial-gradient(circle at 50% 50%, #ffffff 0%, #ffe2c4 45%, #ff8a1f 100%);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="31.5" data-width="1920" data-height="1080">
      <div id="intro" class="scene" data-composition-id="intro" data-composition-src="compositions/intro.html" data-start="0" data-duration="2.8" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="room" class="scene" data-composition-id="room" data-composition-src="compositions/room.html" data-start="2.8" data-duration="2.8" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="race" class="scene" data-composition-id="race" data-composition-src="compositions/race.html" data-start="8.95" data-duration="2.23" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="safari" class="scene" data-composition-id="safari" data-composition-src="compositions/safari.html" data-start="14.52" data-duration="2.23" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="freight" class="scene" data-composition-id="freight" data-composition-src="compositions/freight.html" data-start="19.53" data-duration="2.23" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="outro" class="scene" data-composition-id="outro" data-composition-src="compositions/outro.html" data-start="27.33" data-duration="4.17" data-track-index="1" data-width="1920" data-height="1080"></div>

      <div class="shot" id="shot-ff"><div class="inner" data-layout-allow-overflow><video id="v-ff" class="clip" src="assets/freeflight.mp4" data-start="5.2" data-duration="3.75" data-media-start="16.5" data-track-index="2" muted playsinline></video></div></div>
      <div class="shot" id="shot-ra"><div class="inner" data-layout-allow-overflow><video id="v-ra" class="clip" src="assets/race.mp4" data-start="11.18" data-duration="1.67" data-media-start="15.6" data-playback-rate="1.3" data-track-index="2" muted playsinline></video></div></div>
      <div class="shot" id="shot-rb"><div class="inner" data-layout-allow-overflow><video id="v-rb" class="clip" src="assets/race.mp4" data-start="12.85" data-duration="1.67" data-media-start="20.2" data-playback-rate="1.3" data-track-index="2" muted playsinline></video></div></div>
      <div class="shot" id="shot-sa"><div class="inner" data-layout-allow-overflow><video id="v-sa" class="clip" src="assets/safari.mp4" data-start="16.75" data-duration="2.78" data-media-start="19.6" data-playback-rate="1.2" data-track-index="2" muted playsinline></video></div></div>
      <div class="shot" id="shot-cr"><div class="inner" data-layout-allow-overflow><video id="v-cr" class="clip" src="assets/crate.mp4" data-start="21.76" data-duration="3.34" data-media-start="22.4" data-playback-rate="1.3" data-track-index="2" muted playsinline></video></div></div>
      <div class="shot" id="shot-m1"><div class="inner" data-layout-allow-overflow><video id="v-m1" class="clip" src="assets/race.mp4" data-start="25.1" data-duration="0.56" data-media-start="16.4" data-playback-rate="1.4" data-track-index="2" muted playsinline></video></div></div>
      <div class="shot" id="shot-m2"><div class="inner" data-layout-allow-overflow><video id="v-m2" class="clip" src="assets/safari.mp4" data-start="25.66" data-duration="0.56" data-media-start="33.2" data-playback-rate="1.4" data-track-index="2" muted playsinline></video></div></div>
      <div class="shot" id="shot-m3"><div class="inner" data-layout-allow-overflow><video id="v-m3" class="clip" src="assets/freeflight.mp4" data-start="26.22" data-duration="0.56" data-media-start="21.0" data-playback-rate="1.4" data-track-index="2" muted playsinline></video></div></div>
      <div class="shot" id="shot-m4"><div class="inner" data-layout-allow-overflow><video id="v-m4" class="clip" src="assets/crate.mp4" data-start="26.78" data-duration="0.55" data-media-start="31.5" data-playback-rate="1.4" data-track-index="2" muted playsinline></video></div></div>

      <div id="hud" class="scene" data-composition-id="hud" data-composition-src="compositions/hud.html" data-start="0" data-duration="31.5" data-track-index="3" data-width="1920" data-height="1080"></div>
      <div class="flash" id="flash"></div>

      <audio id="music" src="assets/music-kodama-night-town.mp3" data-start="0" data-duration="31.5" data-media-start="3.4" data-track-index="20" data-volume="0.85" data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":0.3,"v":1},{"t":29.9,"v":1},{"t":31.5,"v":0}]}]}'></audio>
      <audio id="sfx-intro-sparkle" src=".media/audio/sfx/sfx_004.mp3" data-start="0.05" data-duration="1.6" data-track-index="30" data-volume="0.35"></audio>
      <audio id="sfx-intro-pop" src=".media/audio/sfx/sfx_007.mp3" data-start="0.38" data-duration="0.7" data-track-index="31" data-volume="0.3"></audio>
      <audio id="sfx-intro-whoosh" src=".media/audio/sfx/sfx_001.mp3" data-start="2.5" data-duration="0.6" data-track-index="32" data-volume="0.35"></audio>
      <audio id="sfx-room-riser" src=".media/audio/sfx/sfx_002.mp3" data-start="2.85" data-duration="2.75" data-media-start="1.2" data-track-index="33" data-volume="0.22" data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":1},{"t":2.2,"v":1},{"t":2.75,"v":0}]}]}'></audio>
      <audio id="sfx-reveal-whoosh" src=".media/audio/sfx/sfx_001.mp3" data-start="5.04" data-duration="0.6" data-track-index="34" data-volume="0.3"></audio>
      <audio id="sfx-chip-room" src=".media/audio/sfx/sfx_006.mp3" data-start="5.96" data-duration="0.4" data-track-index="35" data-volume="0.35"></audio>
      <audio id="sfx-race-whoosh" src=".media/audio/sfx/sfx_001.mp3" data-start="8.79" data-duration="0.6" data-track-index="36" data-volume="0.35"></audio>
      <audio id="sfx-race-flash" src=".media/audio/sfx/sfx_001.mp3" data-start="11.02" data-duration="0.6" data-track-index="37" data-volume="0.3"></audio>
      <audio id="sfx-chip-race" src=".media/audio/sfx/sfx_006.mp3" data-start="11.46" data-duration="0.4" data-track-index="38" data-volume="0.35"></audio>
      <audio id="sfx-race-cut" src=".media/audio/sfx/sfx_006.mp3" data-start="12.85" data-duration="0.4" data-track-index="39" data-volume="0.3"></audio>
      <audio id="sfx-safari-whoosh" src=".media/audio/sfx/sfx_001.mp3" data-start="14.36" data-duration="0.6" data-track-index="40" data-volume="0.3"></audio>
      <audio id="sfx-bee-pop-1" src=".media/audio/sfx/sfx_007.mp3" data-start="15.15" data-duration="0.7" data-track-index="41" data-volume="0.35"></audio>
      <audio id="sfx-bee-pop-2" src=".media/audio/sfx/sfx_007.mp3" data-start="15.55" data-duration="0.7" data-track-index="42" data-volume="0.35"></audio>
      <audio id="sfx-bee-pop-3" src=".media/audio/sfx/sfx_007.mp3" data-start="16.0" data-duration="0.7" data-track-index="43" data-volume="0.35"></audio>
      <audio id="sfx-chip-safari" src=".media/audio/sfx/sfx_006.mp3" data-start="17.0" data-duration="0.4" data-track-index="44" data-volume="0.35"></audio>
      <audio id="sfx-freight-whoosh" src=".media/audio/sfx/sfx_001.mp3" data-start="19.37" data-duration="0.6" data-track-index="45" data-volume="0.3"></audio>
      <audio id="sfx-freight-impact" src=".media/audio/sfx/sfx_003.mp3" data-start="21.45" data-duration="1.2" data-track-index="46" data-volume="0.22"></audio>
      <audio id="sfx-freight-ping" src=".media/audio/sfx/sfx_008.mp3" data-start="21.5" data-duration="1.3" data-track-index="47" data-volume="0.7"></audio>
      <audio id="sfx-chip-crate" src=".media/audio/sfx/sfx_006.mp3" data-start="22.0" data-duration="0.4" data-track-index="48" data-volume="0.35"></audio>
      <audio id="sfx-m1" src=".media/audio/sfx/sfx_001.mp3" data-start="24.94" data-duration="0.6" data-track-index="49" data-volume="0.2"></audio>
      <audio id="sfx-m2" src=".media/audio/sfx/sfx_001.mp3" data-start="25.5" data-duration="0.6" data-track-index="50" data-volume="0.2"></audio>
      <audio id="sfx-m3" src=".media/audio/sfx/sfx_001.mp3" data-start="26.06" data-duration="0.6" data-track-index="51" data-volume="0.2"></audio>
      <audio id="sfx-m4" src=".media/audio/sfx/sfx_001.mp3" data-start="26.62" data-duration="0.6" data-track-index="52" data-volume="0.2"></audio>
      <audio id="sfx-outro-sparkle" src=".media/audio/sfx/sfx_004.mp3" data-start="27.35" data-duration="1.6" data-track-index="53" data-volume="0.3"></audio>
      <audio id="sfx-outro-pop" src=".media/audio/sfx/sfx_007.mp3" data-start="27.6" data-duration="0.7" data-track-index="54" data-volume="0.25"></audio>
      <audio id="sfx-badge-chime" src=".media/audio/sfx/sfx_005.mp3" data-start="28.5" data-duration="2.4" data-track-index="55" data-volume="0.7"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const rootEl = document.getElementById("root");
      const W = parseInt(rootEl.dataset.width, 10);
      const H = parseInt(rootEl.dataset.height, 10);
      // Footage is cover-fit (object-position 62% for the room shot); map the
      // source drone (1220,790 r220 @1920x1080) into this canvas.
      const k = Math.max(W / 1920, H / 1080);
      const gx = 1220 * k + (W - 1920 * k) * 0.62;
      const gy = 790 * k + (H - 1080 * k) / 2;
      const at = `${gx}px ${gy}px`;
      const full = Math.hypot(W, H) * 1.2;

      // Room -> free flight: the real room grows out of the 3D drone.
      tl.fromTo("#shot-ff", { clipPath: `circle(${220 * k}px at ${at})`, opacity: 0.6 }, { clipPath: `circle(${full}px at ${at})`, opacity: 1, duration: 0.42, ease: "power2.in" }, 5.2);
      tl.fromTo("#shot-ff .inner", { scale: 1 }, { scale: 1.05, duration: 3.75, ease: "none" }, 5.2);

      // Footage -> 3D scene: heat flash on each cut.
      [8.95, 14.52, 19.53].forEach((t) => {
        tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.85, duration: 0.08, ease: "none", immediateRender: false }, t - 0.08);
        tl.to("#flash", { opacity: 0, duration: 0.22, ease: "power2.out" }, t);
      });

      // 3D scene -> footage: out of the white with a punch.
      [
        [11.18, "#shot-ra"],
        [16.75, "#shot-sa"],
        [21.76, "#shot-cr"],
      ].forEach(([t, sel]) => {
        tl.set("#flash", { opacity: 1 }, t);
        tl.to("#flash", { opacity: 0, duration: 0.36, ease: "power2.out" }, t + 0.02);
        tl.fromTo(sel + " .inner", { scale: 1.16 }, { scale: 1.02, duration: 1.6, ease: "power2.out" }, t);
      });
      tl.fromTo("#shot-rb .inner", { scale: 1.08 }, { scale: 1.0, duration: 1.67, ease: "power1.out" }, 12.85);

      // Montage: beat flashes + punch-ins.
      [25.1, 25.66, 26.22, 26.78].forEach((t, i) => {
        tl.fromTo("#flash", { opacity: 0.55 }, { opacity: 0, duration: 0.16, ease: "power2.out", immediateRender: false }, t);
        tl.fromTo(`#shot-m${i + 1} .inner`, { scale: 1.12 }, { scale: 1.0, duration: 0.56, ease: "power2.out" }, t);
      });

      // Montage -> outro.
      tl.fromTo("#flash", { opacity: 0.9 }, { opacity: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, 27.33);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
