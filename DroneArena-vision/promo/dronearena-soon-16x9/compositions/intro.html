<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #intro-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #0d0820;
          container-type: size;
        }
        #intro-world {
          position: absolute;
          inset: 0;
        }
        #intro-floor-wrap {
          position: absolute;
          inset: 0;
          perspective: 900px;
          perspective-origin: 50% 30%;
          -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 62%, #000 20%, transparent 75%);
          mask-image: radial-gradient(ellipse 70% 60% at 50% 62%, #000 20%, transparent 75%);
        }
        #intro-floor {
          position: absolute;
          left: -100%;
          top: 20%;
          width: 300%;
          height: 260%;
          background-image: url("assets/grid.png");
          background-size: 300px 300px;
          transform-origin: 50% 0%;
          opacity: 0.55;
        }
        #intro-halo {
          position: absolute;
          inset: 0;
          background: radial-gradient(circle at 50% 50%, rgba(56, 230, 245, 0.28) 0%, rgba(56, 230, 245, 0.06) 30%, transparent 55%);
        }
        .intro-lockup {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 5cqw;
          padding: 0 6cqw;
        }
        @container (aspect-ratio < 1) {
          .intro-lockup {
            flex-direction: column;
            gap: 5cqh;
          }
          .intro-text {
            align-items: center;
            text-align: center;
          }
        }
        .intro-stage {
          perspective: 1600px;
          flex: none;
        }
        #intro-ico {
          position: relative;
          width: min(42cqh, 62cqw);
          height: min(42cqh, 62cqw);
          transform-style: preserve-3d;
        }
        .intro-layer {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          display: block;
        }
        #intro-back {
          border-radius: 50%;
          overflow: hidden;
          box-shadow: 0 0 0 3px rgba(56, 230, 245, 0.55), 0 40px 120px rgba(56, 230, 245, 0.28);
        }
        #intro-back img {
          width: 100%;
          height: 100%;
          display: block;
        }
        .intro-text {
          display: flex;
          flex-direction: column;
          align-items: flex-start;
          gap: 1.2cqmin;
        }
        .intro-wm {
          font-family: "Archivo Black", sans-serif;
          font-size: min(11cqh, 9.6cqw);
          line-height: 0.9;
          letter-spacing: -0.04em;
          color: #f2ecdd;
          text-transform: uppercase;
        }
        .intro-line {
          display: block;
          overflow: hidden;
          padding-bottom: 0.05em;
        }
        .intro-line > span {
          display: block;
        }
        .intro-pro {
          color: #38e6f5;
          text-shadow: 0 0 0.3em rgba(56, 230, 245, 0.6);
        }
        .intro-kicker {
          font-family: "JetBrains Mono", monospace;
          font-weight: 700;
          font-size: min(2.2cqh, 2.6cqw);
          letter-spacing: 0.24em;
          color: #38e6f5;
          margin-top: 1.4cqmin;
        }
        #intro-black {
          position: absolute;
          inset: 0;
          background: #0d0820;
          opacity: 0;
        }
      </style>

      <div id="intro-root" data-composition-id="intro" data-width="1920" data-height="1080">
        <div id="intro-world">
          <div id="intro-floor-wrap"><div id="intro-floor"></div></div>
          <div id="intro-halo"></div>
          <div class="intro-lockup" id="intro-lockup">
            <div class="intro-stage">
              <div id="intro-ico">
                <div class="intro-layer" id="intro-back"><img src="assets/icon-Back.png" alt="" /></div>
                <img class="intro-layer" id="intro-mid" src="assets/icon-Middle.png" alt="" />
                <img class="intro-layer" id="intro-front" src="assets/icon-Front.png" alt="" />
              </div>
            </div>
            <div class="intro-text" id="intro-text">
              <div class="intro-wm">
                <span class="intro-line" data-layout-allow-overflow><span>Drone</span></span>
                <span class="intro-line" data-layout-allow-overflow><span class="intro-pro">Arena</span></span>
              </div>
              <div class="intro-kicker" id="intro-kicker">DICYANIN LABS / APPLE VISION PRO</div>
            </div>
          </div>
        </div>
        <div id="intro-black"></div>
      </div>

      <script>
        (function () {
          const ID = "intro";
          const tl = gsap.timeline({ paused: true });
          const ico = document.getElementById("intro-ico");
          const S = ico ? ico.offsetWidth || 450 : 450;

          tl.fromTo("#intro-floor", { rotationX: 66, y: 0, opacity: 0 }, { rotationX: 66, y: -420, opacity: 0.55, duration: 3.14, ease: "none" }, 0);
          tl.fromTo("#intro-halo", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 1.2, ease: "expo.out" }, 0.1);

          tl.fromTo("#intro-ico", { rotationY: -34, rotationX: 20 }, { rotationY: 16, rotationX: -6, duration: 2.7, ease: "sine.inOut" }, 0);
          tl.fromTo("#intro-back", { z: -700, scale: 0.5, opacity: 0 }, { z: 0, scale: 1, opacity: 1, duration: 0.7, ease: "expo.out" }, 0.05);
          tl.fromTo("#intro-mid", { z: -500, scale: 0.4, opacity: 0 }, { z: S * 0.18, scale: 1, opacity: 1, duration: 0.65, ease: "expo.out" }, 0.22);
          tl.fromTo("#intro-front", { z: S * 0.36, yPercent: -120, opacity: 0 }, { z: S * 0.36, yPercent: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 0.45);
          tl.to("#intro-mid", { z: S * 0.1, duration: 1.4, ease: "sine.inOut" }, 1.2);
          tl.to("#intro-front", { z: S * 0.2, duration: 1.4, ease: "sine.inOut" }, 1.2);

          tl.fromTo(".intro-line > span", { yPercent: 110 }, { yPercent: 0, duration: 0.55, ease: "expo.out", stagger: 0.1 }, 0.7);
          tl.fromTo("#intro-kicker", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.45, ease: "expo.out" }, 1.15);

          // Exit: dive through the orb.
          tl.to("#intro-text", { opacity: 0, x: 60, duration: 0.35, ease: "power3.in" }, 2.5);
          tl.to("#intro-ico", { scale: 7, duration: 0.6, ease: "power3.in" }, 2.54);
          tl.to("#intro-black", { opacity: 1, duration: 0.2, ease: "power1.in" }, 2.94);
          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>
