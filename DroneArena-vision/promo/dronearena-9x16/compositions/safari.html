<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #safari-root { position: absolute; inset: 0; overflow: hidden; background: #0d0820; container-type: size; }
        #safari-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
        #safari-scrim { position: absolute; inset: 0; z-index: 1;
          background: linear-gradient(to bottom, rgba(13, 8, 32, 0.72) 0%, rgba(13, 8, 32, 0) 32%); }
        #safari-copy { z-index: 2; position: absolute; left: 0; right: 0; top: 7cqh; display: flex;
          flex-direction: column; align-items: center; gap: 1.6cqmin; padding: 0 6cqw; text-align: center; }
        .safari-kicker { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: calc(1.1cqw + 1cqh);
          letter-spacing: 0.24em; color: #38e6f5; }
        .safari-title { font-family: "Archivo Black", sans-serif; font-size: calc(4.4cqw + 3.2cqh); line-height: 1;
          letter-spacing: -0.035em; color: #f2ecdd; text-transform: uppercase; display: flex; flex-wrap: wrap;
          justify-content: center; column-gap: 0.26em; max-width: 92cqw; }
        .safari-w { display: block; overflow: hidden; padding-bottom: 0.06em; }
        .safari-w > span { display: block; }
        .safari-glow { color: #ff8a1f; text-shadow: 0 0 0.35em rgba(255, 138, 31, 0.55); }
      </style>

      <div id="safari-root" data-composition-id="safari" data-width="1080" data-height="1920">
        <canvas id="safari-canvas" data-ee-canvas="safari" data-layout-bleed></canvas>
        <div id="safari-scrim"></div>
        <div id="safari-copy">
          <div class="safari-kicker" id="safari-kicker">SAFARI / CRITTER HUNT</div>
          <div class="safari-title" data-layout-allow-occlusion>
            <span class="safari-w" data-layout-allow-overflow><span>Pop</span></span>
            <span class="safari-w" data-layout-allow-overflow><span>the</span></span>
            <span class="safari-w" data-layout-allow-overflow><span class="safari-glow">critters.</span></span>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const ID = "safari";
          const DUR = 2.23;
          window.__eeTime = window.__eeTime || {};
          window.__eeResolve = window.__eeResolve || {};
          window.__hf = window.__hf || {};
          window.__hf.buildReady = window.__hf.buildReady || {};
          window.__hf.buildReady[ID] = new Promise((r) => (window.__eeResolve[ID] = r));
          const st = { t: 0 };
          const tl = gsap.timeline({ paused: true });
          tl.to(st, { t: DUR, duration: DUR, ease: "none", onUpdate() {
            window.__eeTime[ID] = st.t;
            const f = window.__eeScenes && window.__eeScenes[ID];
            if (f) f(st.t);
          } }, 0);
          tl.fromTo("#safari-kicker", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 0.08);
          tl.fromTo(".safari-w > span", { yPercent: 110 }, { yPercent: 0, duration: 0.45, ease: "expo.out", stagger: 0.06 }, 0.15);
          tl.to(".safari-w > span", { yPercent: -110, duration: 0.28, ease: "power3.in", stagger: 0.035 }, 1.75);
          tl.to("#safari-kicker", { opacity: 0, duration: 0.22 }, 1.75);
          window.__timelines[ID] = tl;
        })();
      </script>
      <script type="module">
        import * as E from "./assets/scene3d.js";
        import * as D from "./assets/drone3d.js";
        const { THREE } = E;
        const { canvas, root } = await E.findStage("safari");
        const { renderer, aspect } = E.makeRenderer(canvas, root);
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(D.VOID, 9, 26);
        const camera = new THREE.PerspectiveCamera(E.fovFor(aspect, 40, 52), aspect, 0.05, 200);
        D.addLights(scene);
        // Low-poly meadow: the drone sweeps through bumblebees that pop into confetti.
        const rand = E.rng(21);
        const ground = new THREE.Mesh(new THREE.CircleGeometry(14, 48), new THREE.MeshStandardMaterial({ color: "#7fd35a", flatShading: true, roughness: 0.9 }));
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);
        const ring = D.makeGridFloor(40, 40, D.CYAN, 0.25);
        ring.position.y = -0.02;
        scene.add(ring);
        for (let i = 0; i < 46; i++) {
          const tr = D.makeTree(rand);
          const a = rand() * Math.PI * 2;
          const r = 3 + rand() * 9;
          tr.position.set(Math.cos(a) * r, 0, Math.sin(a) * r - 3);
          if (Math.abs(tr.position.x) < 1.2 && tr.position.z > -6) tr.position.x += 2.6;
          scene.add(tr);
        }
        for (let i = 0; i < 60; i++) {
          const f = new THREE.Mesh(new THREE.IcosahedronGeometry(0.06, 0), new THREE.MeshBasicMaterial({ color: ["#ff6fb5", "#c45bff", "#ffffff", "#ff8a1f"][i % 4] }));
          f.position.set(rand() * 12 - 6, 0.12, rand() * -12 + 3);
          scene.add(f);
        }
        const bees = [];
        const beeSpots = [
          [-0.9, 1.1, -1.5, 0.75],
          [0.8, 1.35, -3.6, 1.15],
          [-0.4, 1.0, -5.8, 1.6],
          [1.6, 1.6, -2.4, 9],
          [-2.2, 1.4, -4.4, 9],
        ];
        for (const [x, y, z, popAt] of beeSpots) {
          const b = D.makeBee();
          b.position.set(x, y, z);
          scene.add(b);
          const burst = D.makeBurst(rand, ["#ffc928", "#ffffff", "#ff8a1f", "#38e6f5"]);
          burst.root.position.set(x, y, z);
          scene.add(burst.root);
          bees.push({ b, burst, x, y, z, popAt, ph: rand() * 6 });
        }
        const drone = D.makeDrone();
        scene.add(drone.root);
        const path = new THREE.CatmullRomCurve3([
          new THREE.Vector3(0, 1.4, 1.5),
          new THREE.Vector3(-0.9, 1.1, -1.5),
          new THREE.Vector3(0.8, 1.35, -3.6),
          new THREE.Vector3(-0.4, 1.0, -5.8),
          new THREE.Vector3(0.6, 1.5, -8),
        ]);
        const tmp = new THREE.Vector3();
        function draw(t) {
          const u = E.seg(t, 0.1, 2.0) * 0.85;
          path.getPointAt(u, drone.root.position);
          const tan = path.getTangentAt(Math.max(0.001, u));
          drone.root.rotation.set(-0.3, Math.atan2(-tan.x, -tan.z), -tan.x * 0.6);
          D.animateDrone(drone, t);
          camera.position.set(drone.root.position.x * 0.5 + 0.9, drone.root.position.y + 0.9, drone.root.position.z + 3.1);
          camera.lookAt(tmp.copy(drone.root.position).add(new THREE.Vector3(0, -0.1, -1.2)));
          for (const s of bees) {
            const k = E.seg(t, s.popAt, s.popAt + 0.6);
            s.b.visible = t < s.popAt;
            s.b.position.set(s.x + Math.sin(t * 2 + s.ph) * 0.15, s.y + Math.abs(Math.sin(t * 6 + s.ph)) * 0.12, s.z);
            s.b.rotation.y = Math.sin(t * 3 + s.ph) * 0.6;
            s.b.scale.setScalar(t < s.popAt ? 1 + E.seg(t, s.popAt - 0.12, s.popAt) * 0.4 : 1);
            s.burst.update(k);
          }
          renderer.render(scene, camera);
        }
        E.registerScene("safari", draw);
      </script>
    </template>
  </body>
</html>
