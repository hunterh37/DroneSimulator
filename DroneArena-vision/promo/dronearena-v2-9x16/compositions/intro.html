<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #intro-root { position: absolute; inset: 0; overflow: hidden; background: #ece8df; container-type: size; }
        #intro-dots { position: absolute; inset: -10%; background-image: radial-gradient(#0c0c0e 1.2px, transparent 1.4px);
          background-size: 2.4cqw 2.4cqw; opacity: 0.16; }
        #intro-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: #d4ff3a; transform-origin: 0 50%; }
        .in-strip { position: absolute; left: 5cqw; right: 5cqw; font-family: "Space Mono", monospace; font-weight: 700;
          font-size: calc(0.75cqw + 0.75cqh); letter-spacing: 0.2em; color: #0c0c0e; text-transform: uppercase;
          display: flex; justify-content: space-between; }
        #in-top { top: 6cqh; }
        #in-bot { bottom: 6cqh; }
        .in-lockup { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 4cqw; }
        .in-stage { perspective: 1400px; flex: none; }
        #in-ico { position: relative; width: 30cqmin; height: 30cqmin; transform-style: preserve-3d; }
        .in-layer { position: absolute; inset: 0; background-size: cover; background-position: center; border-radius: 50%; }
        #in-back { background-image: url("assets/icon-Back.png"); box-shadow: 0 0 0 0.7cqmin #0c0c0e, 1.6cqmin 1.6cqmin 0 0.7cqmin #0c0c0e; }
        #in-mid { background-image: url("assets/icon-Middle.png"); }
        #in-front { background-image: url("assets/icon-Front.png"); }
        .in-words { display: flex; flex-direction: column; }
        .in-line { display: block; overflow: hidden; }
        .in-line > span { display: inline-block; font-family: "League Gothic", sans-serif; font-size: calc(12cqw + 6cqh);
          line-height: 0.86; color: #0c0c0e; text-transform: uppercase; }
        .in-hl { background: #d4ff3a; padding: 0.03em 0.08em 0; }
        @container (aspect-ratio < 1) {
          .in-lockup { flex-direction: column; gap: 5cqh; }
          .in-words { align-items: center; }
          .in-line > span { font-size: calc(22cqw + 2cqh); }
          #in-ico { width: 46cqmin; height: 46cqmin; }
          .in-strip { flex-direction: column; align-items: center; gap: 1cqh; }
        }
      </style>
      <div id="intro-root" data-composition-id="intro" data-width="1080" data-height="1920">
        <div id="intro-dots"></div>
        <div class="in-strip" id="in-top"><span>Dicyanin Labs</span><span>Spatial drone game</span></div>
        <div class="in-lockup">
          <div class="in-stage">
            <div id="in-ico">
              <div class="in-layer" id="in-back"></div>
              <div class="in-layer" id="in-mid"></div>
              <div class="in-layer" id="in-front"></div>
            </div>
          </div>
          <div class="in-words" data-layout-allow-occlusion>
            <span class="in-line" data-layout-allow-overflow><span>Drone</span></span>
            <span class="in-line" data-layout-allow-overflow><span class="in-hl">Arena</span></span>
          </div>
        </div>
        <div class="in-strip" id="in-bot"><span>For Apple Vision Pro</span><span>Real gameplay ahead</span></div>
        <div id="intro-bar"></div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const S = document.querySelector("#in-ico").offsetWidth || 324;
          tl.fromTo("#intro-bar", { scaleX: 1 }, { scaleX: 0, transformOrigin: "100% 50%", duration: 0.45, ease: "expo.inOut" }, 0);
          tl.fromTo("#intro-dots", { y: 0 }, { y: -60, duration: 2.927, ease: "none" }, 0);
          tl.fromTo("#in-ico", { rotationY: -40, rotationX: 18, scale: 0.6, opacity: 0 },
            { rotationY: 14, rotationX: -4, scale: 1, opacity: 1, duration: 1.6, ease: "expo.out" }, 0.2);
          tl.fromTo("#in-back", { z: -500 }, { z: 0, duration: 0.8, ease: "expo.out" }, 0.25);
          tl.fromTo("#in-mid", { z: -400, opacity: 0 }, { z: S * 0.16, opacity: 1, duration: 0.8, ease: "expo.out" }, 0.35);
          tl.fromTo("#in-front", { yPercent: -130, z: S * 0.34, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.7, ease: "back.out(1.6)" }, 0.5);
          tl.fromTo(".in-line > span", { yPercent: 105 }, { yPercent: 0, duration: 0.55, ease: "expo.out", stagger: 0.1 }, 0.4);
          tl.fromTo(".in-strip", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out", stagger: 0.1 }, 0.6);
          tl.to("#in-front", { y: -8, duration: 0.9, ease: "sine.inOut" }, 1.3);
          window.__timelines["intro"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
