<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #outro-root { position: absolute; inset: 0; overflow: hidden; background: #ece8df; container-type: size; }
        #ou-dots { position: absolute; inset: -10%; background-image: radial-gradient(#0c0c0e 1.2px, transparent 1.4px);
          background-size: 2.4cqw 2.4cqw; opacity: 0.16; }
        .ou-lockup { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 5cqw; padding: 0 6cqw; }

        .ou-hl { background: #d4ff3a; padding: 0.03em 0.08em 0; }

        #ou-badge svg { width: calc(2.2cqw + 1.6cqh); height: calc(2.2cqw + 1.6cqh); }

        #ou-avp { font-family: "Space Mono", monospace; font-weight: 700; font-size: calc(0.7cqw + 0.7cqh);

          .ou-line > span { font-size: calc(19cqw + 2cqh); }

          #ou-tag { font-size: calc(2.6cqw + 0.6cqh); }

          #ou-badge svg { width: calc(6cqw + 1cqh); height: calc(6cqw + 1cqh); }
          .ou-small { font-size: calc(2cqw + 0.4cqh); }
          .ou-big { font-size: calc(5cqw + 0.8cqh); }

            <div id="ou-avp">APPLE VISION PRO</div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const S = document.querySelector("#ou-ico").offsetWidth || 367;
          tl.fromTo("#ou-dots", { y: 0 }, { y: -80, duration: 4.39, ease: "none" }, 0);
          tl.fromTo("#ou-ico", { rotationY: 40, rotationX: 16, scale: 0.6, opacity: 0 },
