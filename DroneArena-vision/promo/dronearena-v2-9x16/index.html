    <script>
      const tl = gsap.timeline({ paused: true });
      const SW = 0.488;
      const ease = "power2.inOut";
      // Scan sweep: 3D maquette <-> real footage share the camera pose, the bar is the seam.
      const sweep = (t, sel, reveal) => {
        const from = reveal ? "inset(0% 100% 0% 0%)" : "inset(0% 0% 0% 0%)";
        const to = reveal ? "inset(0% 0% 0% 0%)" : "inset(0% 0% 0% 100%)";
        tl.fromTo(sel, { clipPath: from }, { clipPath: to, duration: SW, ease, immediateRender: false }, t);
        tl.fromTo("#scanwrap", { xPercent: -100, opacity: 1 }, { xPercent: 0, opacity: 1, duration: SW, ease, immediateRender: false }, t);
        tl.set("#scanwrap", { opacity: 0 }, t + SW);
      };
      gsap.set(["#shot-ff", "#shot-ra", "#shot-sa", "#shot-cr"], { clipPath: "inset(0% 100% 0% 0%)" });
      sweep(5.366, "#shot-ff", true);
      sweep(9.268, "#shot-ff", false);
      sweep(11.22, "#shot-ra", true);
      sweep(14.146, "#shot-ra", false);
      sweep(16.585, "#shot-sa", true);
      sweep(19.512, "#shot-sa", false);
      sweep(21.951, "#shot-cr", true);

      // Post-reveal drift on shots whose exit is not a matched seam.
      tl.fromTo("#shot-ra .inner", { scale: 1 }, { scale: 1.05, duration: 2.4, ease: "none" }, 11.71);
      tl.fromTo("#shot-sa .inner", { scale: 1 }, { scale: 1.05, duration: 2.4, ease: "none" }, 17.07);
      tl.fromTo("#shot-cr .inner", { scale: 1 }, { scale: 1.06, duration: 2.93, ease: "none" }, 22.44);

      // Montage: hard cuts on the beat with a paper pop and punch-in.
      [25.366, 25.854, 26.341, 26.829].forEach((t, i) => {
        tl.fromTo("#pop", { opacity: 0.6 }, { opacity: 0, duration: 0.16, ease: "power2.out", immediateRender: false }, t);
        tl.fromTo(`#shot-m${i + 1} .inner`, { scale: 1.14 }, { scale: 1.0, duration: 0.488, ease: "power2.out" }, t);
      });

      // Acid swipe: intro -> room, montage -> outro.
      gsap.set("#swipe", { scaleX: 0 });
      for (const t of [2.927, 27.317]) {
        tl.fromTo("#swipe", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.24, ease: "power3.in", immediateRender: false }, t - 0.25);
        tl.fromTo("#swipe", { scaleX: 1, transformOrigin: "100% 50%" }, { scaleX: 0, transformOrigin: "100% 50%", duration: 0.3, ease: "power3.out", immediateRender: false }, t);
      }
      window.__timelines["main"] = tl;
